name: Format
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    timeout-minutes: 5
    runs-on: ${{ github.repository_owner == 'aeonfun' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # Standalone Biome binary, version read from package-lock.json, so the
      # check needs no npm install. Same command as `npm run format:check`.
      - uses: biomejs/setup-biome@v2
      - run: biome ci .
