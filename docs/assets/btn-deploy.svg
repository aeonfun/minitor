<svg xmlns="http://www.w3.org/2000/svg" width="122" height="40" viewBox="0 0 122 40" role="img" aria-label="Deploy">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a15"/>
      <stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>
    <style>
      @keyframes bob{0%,100%{transform:translateY(1px)}50%{transform:translateY(-1.5px)}}
