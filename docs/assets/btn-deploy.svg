      @keyframes fl{0%,100%{opacity:.45;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1.3)}}
      .fl{transform-box:fill-box;transform-origin:top center;animation:fl .5s ease-in-out infinite}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="121" height="39" rx="19.5" fill="url(#g)" stroke="#F4EFE1" stroke-opacity="0.5"/>
